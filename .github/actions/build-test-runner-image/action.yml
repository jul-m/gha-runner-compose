name: "Build & Test Runner Image"
description: "Builds, boots, waits, and cleans up a GitHub Actions runner container for a given image"
author: "jul-m"

inputs:
  image-tag:
    description: "Local Docker tag used to reference the built image"
    required: true
  build-target:
    description: "Dockerfile target stage to build"
    required: true
  arch:
    description: "Target architecture (amd64 or arm64)"
    required: true
  runner-suffix:
    description: "Suffix used to generate unique runner/container names"
    required: true
  components:
    description: "Optional COMPONENTS value passed during build"
    required: false
    default: ""
  additional-build-args:
    description: "Optional extra build arguments appended to docker build"
    required: false
    default: ""
  test-job-name:
    description: "Name of the job that must succeed when executed on the started runner (required unless skip-runner is true)"
    required: false
    default: ""
  additional-runner-labels:
    description: "Optional extra runner labels (comma-separated) appended to the dynamic label"
    required: false
    default: ""
  app-client-id:
    description: "GitHub App client ID (mode 1: App token, preferred). The App needs repository Administration: write"
    required: false
    default: ""
  app-private-key:
    description: "GitHub App private key (mode 1)"
    required: false
    default: ""
  admin-token:
    description: "PAT with administration:write (mode 2, used when no App credentials are given). With neither, the self-hosted runner test is skipped with a warning"
    required: false
    default: ""
  skip-build:
    description: "Set to 'true' to skip docker build (expects image to be pre-loaded)"
    required: false
    default: "false"
  push-image-refs:
    description: "Optional newline-separated registry refs to tag and push the built image to, once the test job has succeeded"
    required: false
    default: ""
  own-job-name:
    description: "This build job's own workflow job name, so the orphaned-job sweep can exclude itself (a running job never sees its own conclusion)"
    required: false
    default: ""
  content-tag:
    description: "Full content-addressed registry ref (e.g. staging:content-<hash>-base-amd64). If it already exists, skip the rebuild and pull it instead - the image still gets re-tested below either way, just without paying for docker build again."
    required: false
    default: ""

outputs:
  runner-name:
    description: "Name assigned to the temporary self-hosted runner"
    value: ${{ steps.setup-context.outputs.runner_name }}
  runner-label:
    description: "Primary label assigned to the temporary self-hosted runner"
    value: ${{ steps.setup-context.outputs.runner_label }}
  container-name:
    description: "Docker container name used for the temporary runner"
    value: ${{ steps.setup-context.outputs.container_name }}
  reused:
    description: "'true' if an existing content-tagged image was reused instead of rebuilding"
    value: ${{ steps.check-reuse.outputs.reused }}

runs:
  using: "composite"
  steps:
    - id: setup-context
      shell: bash
      run: |  # shell
        # Setup context variables
        RUNNER_NAME="test-runner-${{ inputs.runner-suffix }}-${{ github.run_id }}"
        RUNNER_LABEL="test-runner-${{ inputs.runner-suffix }}-${{ github.run_id }}"
        CONTAINER_NAME="test-runner-${{ inputs.runner-suffix }}-${{ github.run_id }}"
        IMAGE_TAG="${{ inputs.image-tag }}"
        ADDITIONAL_LABELS="${{ inputs.additional-runner-labels }}"
        if [[ -n "${ADDITIONAL_LABELS}" ]]; then
          RUNNER_LABELS="${RUNNER_LABEL},${ADDITIONAL_LABELS}"
        else
          RUNNER_LABELS="${RUNNER_LABEL}"
        fi
        {
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_LABEL=${RUNNER_LABEL}"
          echo "RUNNER_LABELS=${RUNNER_LABELS}"
          echo "CONTAINER_NAME=${CONTAINER_NAME}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
        } >>"$GITHUB_ENV"
        {
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_label=${RUNNER_LABEL}"
          echo "runner_labels=${RUNNER_LABELS}"
          echo "container_name=${CONTAINER_NAME}"
        } >>"$GITHUB_OUTPUT"

    - name: Set up Docker
      uses: docker/setup-docker-action@v4

    - name: Set up Buildx (docker driver for local base image)
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker
        driver-opts: |
          containerd-image-store=true

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Resolve runner admin auth
      id: auth
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.app-client-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        ADMIN_TOKEN: ${{ inputs.admin-token }}
      run: |  # shell
        # Resolve runner admin auth: GitHub App, else PAT, else no runner test
        if [[ -n "${APP_CLIENT_ID}" && -n "${APP_PRIVATE_KEY}" ]]; then
          echo "mode=app" >> "$GITHUB_OUTPUT"
        elif [[ -n "${ADMIN_TOKEN}" ]]; then
          echo "mode=pat" >> "$GITHUB_OUTPUT"
        else
          echo "mode=none" >> "$GITHUB_OUTPUT"
          echo "::warning title=Runner test skipped::No GH_APP_CLIENT_ID/GH_APP_KEY nor ACTION_GH_TOKEN secret: the image is built but not tested on a self-hosted runner."
        fi

    - name: Create GitHub App token
      id: app-token
      if: steps.auth.outputs.mode == 'app'
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-administration: write

    - name: Check for reusable content-tagged image
      if: inputs.content-tag != ''
      id: check-reuse
      shell: bash
      run: |  # shell
        # If this exact content (Dockerfile/docker-build/docker-assets/
        # runner-images-src) already built successfully before, skip the
        # expensive rebuild and pull the existing image instead - it still
        # gets re-tested below like any other build, just without paying
        # for docker build again.
        if docker buildx imagetools inspect "${{ inputs.content-tag }}" >/dev/null 2>&1; then
          echo "Reusing ${{ inputs.content-tag }} - content unchanged since it was last built."
          echo "reused=true" >> "$GITHUB_OUTPUT"
        else
          echo "reused=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build image
      if: inputs.skip-build != 'true' && steps.check-reuse.outputs.reused != 'true'
      uses: docker/build-push-action@v6
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        load: true
        target: ${{ inputs.build-target }}
        tags: ${{ inputs.image-tag }}
        build-args: |
          COMPONENTS=${{ inputs.components }}
          APT_MIRROR=ci
          ${{ inputs.additional-build-args }}
        secrets: |
          id=GITHUB_TOKEN,env=GITHUB_TOKEN

    - name: Pull reused content-tagged image
      if: steps.check-reuse.outputs.reused == 'true'
      shell: bash
      run: |  # shell
        # Pull reused content-tagged image
        docker pull "${{ inputs.content-tag }}"
        docker tag "${{ inputs.content-tag }}" "${IMAGE_TAG}"

    - name: Verify image was built
      shell: bash
      run: |  # shell
        # Verify image was built
        docker image ls "${IMAGE_TAG}"
        docker image inspect "${IMAGE_TAG}" --format='{{json .}}' | jq '.RepoTags, .Size'

    - name: Start runner container
      if: steps.auth.outputs.mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.admin-token }}
      run: |  # shell
        # Start runner container
        TOKEN=$(gh api --method POST "repos/${{ github.repository }}/actions/runners/registration-token" --jq .token)
        docker run -d --name "${CONTAINER_NAME}" \
          -e RUNNER_REPO_URL="${{ github.server_url }}/${{ github.repository }}" \
          -e RUNNER_TOKEN="${TOKEN}" \
          -e RUNNER_NAME="${RUNNER_NAME}" \
          -e RUNNER_LABELS="${RUNNER_LABELS}" \
          "${IMAGE_TAG}"

    - name: Wait for runner registration and execution
      if: steps.auth.outputs.mode != 'none'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |  # shell
        # Wait for runner registration and execution
        TEST_JOB_NAME="${{ inputs.test-job-name }}"
        if [[ -z "${TEST_JOB_NAME}" ]]; then
          echo "❌ 'test-job-name' input is required when the runner test is enabled."
          exit 1
        fi

        counter=0
        while true; do
          echo "Waiting for runner readiness..."
          if ! docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
            echo "❌ Runner container ${CONTAINER_NAME} has stopped unexpectedly."
            echo "Runner logs:"
            docker logs "${CONTAINER_NAME}" 2>&1
            exit 1
          fi

          LOGS=$(docker logs "${CONTAINER_NAME}" 2>&1)
          if echo "${LOGS}" | grep -q "Listening for Jobs"; then
            echo "✅ Runner registered successfully."
            break
          fi

          counter=$((counter + 1))
          if [[ ${counter} -ge 30 ]]; then
            echo "❌ Timeout waiting for runner to register."
            echo "Runner logs:"
            echo "${LOGS}"
            exit 1
          fi

          sleep 10
        done

        echo "Waiting for job '${TEST_JOB_NAME}' to complete..."
        counter=0
        while true; do
          JOB_STATUS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq ".jobs[] | select(.name == \"${TEST_JOB_NAME}\") | .conclusion")

          if [[ "${JOB_STATUS}" == "success" ]]; then
            echo "✅ Job '${TEST_JOB_NAME}' completed successfully."
            break
          elif [[ "${JOB_STATUS}" == "failure" || "${JOB_STATUS}" == "cancelled" || "${JOB_STATUS}" == "timed_out" ]]; then
            echo "❌ Job '${TEST_JOB_NAME}' failed with status: ${JOB_STATUS}"
            exit 1
          fi

          counter=$((counter + 1))
          if [[ ${counter} -ge 30 ]]; then
            echo "❌ Timeout waiting for job '${TEST_JOB_NAME}' to complete."
            exit 1
          fi

          sleep 10
        done

    - name: Push tested image to registry
      if: inputs.push-image-refs != ''
      shell: bash
      run: |  # shell
        # Push tested image to registry under each given ref (one per line):
        # a CI-run-scoped ref other jobs in this run pull as their BASE_IMAGE,
        # and the content-addressed ref future runs check to skip rebuilding
        # this exact content - also what publish-release.yml promotes
        # directly on a release, no rebuild or PR-scoped tag needed. Pushing
        # the content-tag again when reused is a cheap no-op (same digest
        # already there).
        while IFS= read -r REF; do
          [[ -z "${REF}" ]] && continue
          docker tag "${IMAGE_TAG}" "${REF}"
          docker push "${REF}"
        done <<< "${{ inputs.push-image-refs }}"

    - name: Cleanup runner
      if: always() && steps.auth.outputs.mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.admin-token }}
      run: |  # shell
        # Cleanup runner
        docker stop "${CONTAINER_NAME}" >/dev/null 2>&1 || true
        docker rm "${CONTAINER_NAME}" >/dev/null 2>&1 || true

        if [[ -z "${GH_TOKEN}" ]]; then
          echo "ℹ️ No GitHub token provided; skipping GitHub API cleanup."
          exit 0
        fi

        RUNNER_ID=$(gh api "repos/${{ github.repository }}/actions/runners" \
          --jq ".runners[] | select(.name == \"${RUNNER_NAME}\") | .id" 2>/dev/null || echo "")

        if [[ -n "${RUNNER_ID}" ]]; then
          echo "Removing runner with ID: ${RUNNER_ID}"
          gh api --method DELETE "repos/${{ github.repository }}/actions/runners/${RUNNER_ID}" >/dev/null 2>&1 || true
        else
          echo "Runner ${RUNNER_NAME} not found or already removed."
        fi

    - name: Rescue orphaned test job
      if: (failure() || cancelled()) && steps.auth.outputs.mode != 'none' && inputs.test-job-name != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.admin-token }}
        RUN_TOKEN: ${{ github.token }}
      run: |  # shell
        # Rescue orphaned test job: the build failed, so the container runner the "Test" job waits for
        # never registers. Start a bare runner agent on this host with the same label; the Test job
        # sees its name (rescue-*) and fails at once instead of queueing for hours.
        JOB_JSON=$(GH_TOKEN="${RUN_TOKEN}" gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
          --jq ".jobs[] | select(.name == \"${{ inputs.test-job-name }}\")") || true
        if [[ "$(jq -r '.status // ""' <<<"${JOB_JSON}")" != "queued" ]]; then
          echo "Test job not queued (status: $(jq -r '.status // "not found"' <<<"${JOB_JSON}")); nothing to rescue."
          exit 0
        fi

        RESCUE_NAME="rescue-${RUNNER_NAME}"
        case "$(uname -m)" in aarch64) RUNNER_ARCH=arm64 ;; *) RUNNER_ARCH=x64 ;; esac
        VERSION=$(gh api repos/actions/runner/releases/latest --jq .tag_name)
        DIR="${{ runner.temp }}/rescue-runner"
        mkdir -p "${DIR}" && cd "${DIR}"
        curl -fsSL "https://github.com/actions/runner/releases/download/${VERSION}/actions-runner-linux-${RUNNER_ARCH}-${VERSION#v}.tar.gz" | tar xz
        REG_TOKEN=$(gh api --method POST "repos/${{ github.repository }}/actions/runners/registration-token" --jq .token)
        ./config.sh --unattended --ephemeral --replace --no-default-labels \
          --url "${{ github.server_url }}/${{ github.repository }}" --token "${REG_TOKEN}" \
          --name "${RESCUE_NAME}" --labels "${RUNNER_LABEL}"
        timeout 300 ./run.sh || echo "⚠️ Rescue runner did not pick up '${{ inputs.test-job-name }}' within 5 min."

        RESCUE_ID=$(gh api "repos/${{ github.repository }}/actions/runners" \
          --jq ".runners[] | select(.name == \"${RESCUE_NAME}\") | .id" 2>/dev/null || echo "")
        if [[ -n "${RESCUE_ID}" ]]; then
          gh api --method DELETE "repos/${{ github.repository }}/actions/runners/${RESCUE_ID}" >/dev/null 2>&1 || true
        fi

    - name: Sweep orphaned dependent jobs
      if: always() && steps.auth.outputs.mode != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |  # shell
        # A failed build leaves its self-hosted test job queued forever - no
        # matching runner will ever register, and GitHub only auto-cancels
        # self-hosted queued jobs after 24-48h (timeout-minutes only bounds
        # execution time once a runner picks the job up, not queue time).
        # Runs on every invocation - success or failure - so whichever build
        # job finishes last sweeps up any earlier stragglers. Only cancels
        # once every OTHER build job in the run has reached a terminal state,
        # so a category still actively building is never interrupted (that's
        # what caused the mass-cancellation bug this replaced). This job's
        # own entry is excluded from that check: it can never see its own
        # conclusion while still running this step, so counting it would
        # make the check impossible to satisfy.
        OWN_JOB_NAME="${{ inputs.own-job-name }}"
        ALL_JOBS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs') || exit 0

        BUILDS_PENDING=$(jq --arg own "${OWN_JOB_NAME}" '[.[] | select((.name | startswith("Test ") | not) and (.name != $own) and (.status == "queued" or .status == "in_progress") and (.conclusion == null))] | length' <<<"${ALL_JOBS}")
        ORPHANED_TESTS=$(jq -r '[.[] | select((.name | startswith("Test ")) and (.status == "queued" or .status == "in_progress") and (.conclusion == null)) | .name]' <<<"${ALL_JOBS}")
        ORPHANED_COUNT=$(jq 'length' <<<"${ORPHANED_TESTS}")

        if [[ "${BUILDS_PENDING}" -eq 0 && "${ORPHANED_COUNT}" -gt 0 ]]; then
          echo "❌ All build jobs are done but ${ORPHANED_COUNT} test job(s) are still queued with no runner coming: $(jq -r 'join(", ")' <<<"${ORPHANED_TESTS}")."
          echo "Cancelling workflow ${GITHUB_RUN_ID} so they resolve instead of sitting queued for up to 24-48h."
          gh run cancel "${GITHUB_RUN_ID}" || gh api --method POST "repos/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}/force-cancel" || true
        fi
