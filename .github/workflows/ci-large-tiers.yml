name: CI Large Tiers
run-name: "CI Large Tiers - ${{ github.event_name }} - #${{ github.run_number }}"

# Split from ci.yml (separate run ID) so a failure there can't cascade-cancel
# this workflow. Auto-triggers via workflow_run once ci.yml completes,
# reusing its "build" category image instead of rebuilding (see
# check-target). branches: [main] just cuts trigger noise - it can't see a
# PR's base branch, only reduces which feature-branch runs fire this at all;
# check-target's is_release_pr lookup does the actual gating.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: read

env:
  # Content-tags (content-<hash>-<name>-<arch>) drive the actual build chain
  # and reuse decisions. CI_RUN_TAG is only used as a per-run-scoped alias
  # for the local smoke-test image and the release-PR retag source.
  CI_RUN_TAG: ci-${{ github.run_id }}
  STAGING_IMG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging
  REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ci-large-tiers-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  # Fork-PR safety is inherited from ci.yml: forks never get a content-tagged
  # "build" image pushed, so the existence check below naturally stays off
  # for them too. is_release_pr is looked up via the API, not workflow_run's
  # `pull_requests` payload field (population conditions aren't documented).
  check-target:
    name: Resolve target ref
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.determine.outputs.should_run }}
      ref: ${{ steps.resolve.outputs.ref }}
      is_release_pr: ${{ steps.resolve.outputs.is_release_pr }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      content_hash: ${{ steps.hash.outputs.content_hash }}
      exists_json: ${{ steps.determine.outputs.exists_json }}
    steps:
      - name: Resolve ref to test
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |  # shell
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            HEAD_BRANCH="${{ github.ref_name }}"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${HEAD_BRANCH}" --base release --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "${PR_NUMBER}" ]]; then
            {
              echo "is_release_pr=true"
              echo "pr_number=${PR_NUMBER}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "is_release_pr=false"
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Compute content hash
        id: hash
        run: |  # shell
          # Compute content hash - same formula as ci.yml, so identical
          # content always produces the identical tag regardless of workflow.
          HASH=$( { git rev-parse HEAD:Dockerfile; git rev-parse HEAD:docker-build; git rev-parse HEAD:docker-assets; git rev-parse HEAD:runner-images-src; } | sha256sum | cut -c1-16)
          echo "content_hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Determine whether to proceed
        id: determine
        run: |  # shell
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "${{ steps.resolve.outputs.is_release_pr }}" != "true" ]]; then
            echo "Not a release PR - large tiers only auto-build for main -> release PRs (use workflow_dispatch otherwise)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "exists_json={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Checked once here, not per-job: a job whose image already exists
          # is skipped entirely below - no runner spin-up, no re-test.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BASE="${{ env.STAGING_IMG }}:content-${{ steps.hash.outputs.content_hash }}"
          RESULT="{}"
          # Tracked per (name, arch), not combined - a tier job is now its
          # own per-arch job (see build-tier-*-amd64/-arm64 below), so if
          # only one arch's build genuinely failed (e.g. the self-hosted
          # runner ran out of disk mid-build), the OTHER arch's already-good
          # content-tag must still read as reusable, not force a needless
          # rebuild alongside the real retry.
          for NAME in base essentials build medium large xlarge all; do
            for ARCH in amd64 arm64; do
              if docker buildx imagetools inspect "${BASE}-${NAME}-${ARCH}" >/dev/null 2>&1; then
                RESULT=$(jq -c --arg k "${NAME}-${ARCH}" '. + {($k): true}' <<<"${RESULT}")
              else
                RESULT=$(jq -c --arg k "${NAME}-${ARCH}" '. + {($k): false}' <<<"${RESULT}")
              fi
            done
          done
          echo "exists_json=${RESULT}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            BUILD_EXISTS=$(jq -r '."build-amd64" and ."build-arm64"' <<<"${RESULT}")
            if [[ "${BUILD_EXISTS}" == "true" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "ci.yml hasn't produced a build-category image for this exact content yet - nothing to do."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ── BASE / ESSENTIALS / BUILD (workflow_dispatch only) ──────────────────
  # Only runs for manual workflow_dispatch runs, which have no ci.yml run to
  # reuse a "build" category image from. workflow_run skips all of this and
  # chains straight off ci.yml's own content-tagged build-category image
  # instead - no point rebuilding what was just built. Content-tagged the
  # same way as ci.yml, so a workflow_dispatch run on identical content
  # reuses whatever's already in staging too, from either workflow.
  build-test-base:
    name: Build and Test Base Image (${{ matrix.arch }})
    needs: check-target
    if: github.event_name == 'workflow_dispatch' && needs.check-target.outputs.should_run == 'true' && (fromJSON(needs.check-target.outputs.exists_json)['base-amd64'] != true || fromJSON(needs.check-target.outputs.exists_json)['base-arm64'] != true)
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build base image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose-base:test-${{ matrix.arch }}
          build-target: base
          runner-suffix: lt-base-${{ matrix.arch }}
          cache-scope: base-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (base / {0})', matrix.arch) }}
          own-job-name: ${{ format('Build and Test Base Image ({0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-base-${{ matrix.arch }}
          push-image-refs: |
            ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-base-${{ matrix.arch }}

  test-base:
    name: Test Runner (base / ${{ matrix.arch }})
    needs: check-target
    if: github.event_name == 'workflow_dispatch' && needs.check-target.outputs.should_run == 'true' && (fromJSON(needs.check-target.outputs.exists_json)['base-amd64'] != true || fromJSON(needs.check-target.outputs.exists_json)['base-arm64'] != true)
    runs-on: ${{ format('test-runner-lt-base-{0}-{1}', matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Basic smoke test for base image
          echo "Hello from self-hosted runner (base / ${{ matrix.arch }})!"
          uname -a

  build-test-essentials:
    name: Build and Test Essentials Image (${{ matrix.arch }})
    needs: [check-target, build-test-base]
    if: always() && github.event_name == 'workflow_dispatch' && needs.check-target.outputs.should_run == 'true' && needs.build-test-base.result != 'failure' && needs.build-test-base.result != 'cancelled' && (fromJSON(needs.check-target.outputs.exists_json)['essentials-amd64'] != true || fromJSON(needs.check-target.outputs.exists_json)['essentials-arm64'] != true)
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build essentials image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose:lt-essentials-test-${{ matrix.arch }}
          build-target: runner-build
          runner-suffix: lt-essentials-${{ matrix.arch }}
          cache-scope: essentials-${{ matrix.arch }}
          runner-components: all-essentials
          additional-build-args: |
            BASE_IMAGE=${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-base-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (essentials / {0})', matrix.arch) }}
          own-job-name: ${{ format('Build and Test Essentials Image ({0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-essentials-${{ matrix.arch }}
          push-image-refs: |
            ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-essentials-${{ matrix.arch }}

  test-essentials:
    name: Test Runner (essentials / ${{ matrix.arch }})
    needs: [check-target, build-test-base]
    if: always() && github.event_name == 'workflow_dispatch' && needs.check-target.outputs.should_run == 'true' && needs.build-test-base.result != 'failure' && needs.build-test-base.result != 'cancelled' && (fromJSON(needs.check-target.outputs.exists_json)['essentials-amd64'] != true || fromJSON(needs.check-target.outputs.exists_json)['essentials-arm64'] != true)
    runs-on: ${{ format('test-runner-lt-essentials-{0}-{1}', matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Smoke test for essentials image
          echo "Hello from self-hosted runner (essentials / ${{ matrix.arch }})!"
          uname -a

  build-test-category:
    name: Build and Test build Image (${{ matrix.arch }})
    needs: [check-target, build-test-essentials]
    if: always() && github.event_name == 'workflow_dispatch' && needs.check-target.outputs.should_run == 'true' && needs.build-test-essentials.result != 'failure' && needs.build-test-essentials.result != 'cancelled' && (fromJSON(needs.check-target.outputs.exists_json)['build-amd64'] != true || fromJSON(needs.check-target.outputs.exists_json)['build-arm64'] != true)
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build build image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose:lt-build-test-${{ matrix.arch }}
          build-target: runner-build
          runner-suffix: lt-build-${{ matrix.arch }}
          cache-scope: build-${{ matrix.arch }}
          runner-components: all-build
          additional-build-args: |
            BASE_IMAGE=${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-essentials-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (build / {0})', matrix.arch) }}
          own-job-name: ${{ format('Build and Test build Image ({0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-build-${{ matrix.arch }}
          push-image-refs: |
            ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-build-${{ matrix.arch }}

  test-category:
    name: Test Runner (build / ${{ matrix.arch }})
    needs: [check-target, build-test-essentials]
    if: always() && github.event_name == 'workflow_dispatch' && needs.check-target.outputs.should_run == 'true' && needs.build-test-essentials.result != 'failure' && needs.build-test-essentials.result != 'cancelled' && (fromJSON(needs.check-target.outputs.exists_json)['build-amd64'] != true || fromJSON(needs.check-target.outputs.exists_json)['build-arm64'] != true)
    runs-on: ${{ format('test-runner-lt-build-{0}-{1}', matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run smoke test
        run: |  # shell
          # Smoke test for build image
          echo "Hello from self-hosted runner (build / ${{ matrix.arch }})!"
          uname -a

  # ── LARGE TIERS ───────────────────────────────────────────────────────────
  # One job per tier per arch (not a single job matrixed by arch): with only
  # one physical self-hosted runner, a matrixed job still executes both arch
  # legs sequentially anyway, but GitHub is free to interleave them (e.g.
  # medium-amd64, medium-arm64, large-amd64, ...) since a tier job only
  # waits for the SAME tier's other arch leg, not the previous tier's own
  # arch. That interleaving doubles how much unrelated content (the other
  # arch's tier) gets pushed into the persistent BuildKit builder's
  # size-capped cache (tools/buildkitd.toml, ~30GiB) between when a tier is
  # built and when its own arch's next tier needs it as BASE_IMAGE - which
  # measurably evicted it: large-amd64 took 179s to resolve FROM
  # medium-amd64 (a real ~2min re-download), confirmed via the builder's
  # live logs, right after medium-arm64 had also built in between.
  #
  # Each arch's full chain (medium -> large -> xlarge -> all) now runs
  # back-to-back with nothing else touching the cache in between, then the
  # next arch's chain starts - same total work, same single runner, just
  # reordered so a tier's cache entry is still warm when consumed. arm64's
  # first job depends on amd64's LAST job only for ordering (always(), no
  # failure-blocking) - an amd64 failure must not prevent arm64 from being
  # attempted, preserving the original fail-fast:false independence between
  # arches.
  #
  # A failure building "all" no longer erases medium/large/xlarge, which
  # already succeeded, are already durably pushed to GHCR staging, and are
  # reported as their own green checks regardless of what happens
  # downstream. Each job builds straight FROM the previous tier's staging
  # tag and pushes straight back to staging - no local registry hand-off,
  # the image lives in exactly one place (see
  # [[gha-runner-compose-large-tiers-registry-roundtrip]]).
  build-tier-medium-amd64:
    name: Build and Test medium Tier (amd64)
    needs: [check-target, build-test-category]
    # build-test-category is legitimately skipped on the workflow_run path
    # (it only runs for workflow_dispatch) - a plain `if:` gets implicitly
    # ANDed with success() by GitHub unless it calls always()/failure()/
    # cancelled() itself, and success() is false when a needed job was
    # skipped, not just when it failed. always() bypasses that, then the
    # explicit checks below restore real failure-blocking.
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-test-category.result != 'failure' && needs.build-test-category.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['medium-amd64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build medium tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: medium
          arch: amd64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-build-amd64
          runner-components: all-cloud,all-nodejs,all-java,all-container,all-python,all-rust
          smoke-test-cmd: "uname -a && command -v aws && command -v java && command -v python3"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-medium-amd64

  build-tier-large-amd64:
    name: Build and Test large Tier (amd64)
    needs: [check-target, build-tier-medium-amd64]
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-tier-medium-amd64.result != 'failure' && needs.build-tier-medium-amd64.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['large-amd64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build large tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: large
          arch: amd64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-medium-amd64
          runner-components: all-dotnet,all-php,all-ruby,all-r,all-julia,pipx-packages,all-web,all-databases
          smoke-test-cmd: "uname -a && command -v dotnet && command -v ruby"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-large-amd64

  build-tier-xlarge-amd64:
    name: Build and Test xlarge Tier (amd64)
    needs: [check-target, build-tier-large-amd64]
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-tier-large-amd64.result != 'failure' && needs.build-tier-large-amd64.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['xlarge-amd64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build xlarge tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: xlarge
          arch: amd64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-large-amd64
          runner-components: all-swift,actions-cache,codeql-bundle,firefox,selenium,awf,copilot-cli
          smoke-test-cmd: "uname -a && command -v firefox"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-xlarge-amd64

  build-tier-all-amd64:
    name: Build and Test all Tier (amd64)
    needs: [check-target, build-tier-xlarge-amd64]
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-tier-xlarge-amd64.result != 'failure' && needs.build-tier-xlarge-amd64.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['all-amd64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build all tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: all
          arch: amd64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-xlarge-amd64
          runner-components: all
          smoke-test-cmd: "uname -a"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-all-amd64

  build-tier-medium-arm64:
    name: Build and Test medium Tier (arm64)
    needs: [check-target, build-test-category, build-tier-all-amd64]
    # Depends on the amd64 chain's LAST job purely for ordering (see header
    # comment above) - always() means an amd64 failure never blocks arm64.
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-test-category.result != 'failure' && needs.build-test-category.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['medium-arm64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build medium tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: medium
          arch: arm64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-build-arm64
          runner-components: all-cloud,all-nodejs,all-java,all-container,all-python,all-rust
          smoke-test-cmd: "uname -a && command -v aws && command -v java && command -v python3"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-medium-arm64

  build-tier-large-arm64:
    name: Build and Test large Tier (arm64)
    needs: [check-target, build-tier-medium-arm64]
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-tier-medium-arm64.result != 'failure' && needs.build-tier-medium-arm64.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['large-arm64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build large tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: large
          arch: arm64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-medium-arm64
          runner-components: all-dotnet,all-php,all-ruby,all-r,all-julia,pipx-packages,all-web,all-databases
          smoke-test-cmd: "uname -a && command -v dotnet && command -v ruby"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-large-arm64

  build-tier-xlarge-arm64:
    name: Build and Test xlarge Tier (arm64)
    needs: [check-target, build-tier-large-arm64]
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-tier-large-arm64.result != 'failure' && needs.build-tier-large-arm64.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['xlarge-arm64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build xlarge tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: xlarge
          arch: arm64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-large-arm64
          runner-components: all-swift,actions-cache,codeql-bundle,firefox,selenium,awf,copilot-cli
          smoke-test-cmd: "uname -a && command -v firefox"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-xlarge-arm64

  build-tier-all-arm64:
    name: Build and Test all Tier (arm64)
    needs: [check-target, build-tier-xlarge-arm64]
    if: always() && needs.check-target.outputs.should_run == 'true' && needs.build-tier-xlarge-arm64.result != 'failure' && needs.build-tier-xlarge-arm64.result != 'cancelled' && fromJSON(needs.check-target.outputs.exists_json)['all-arm64'] != true
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build all tier
        uses: ./.github/actions/build-large-tier-image
        with:
          tier: all
          arch: arm64
          base-image: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-xlarge-arm64
          runner-components: all
          smoke-test-cmd: "uname -a"
          staging-img: ${{ env.STAGING_IMG }}
          ci-run-tag: ${{ env.CI_RUN_TAG }}
          registry: ${{ env.REGISTRY }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.STAGING_IMG }}:content-${{ needs.check-target.outputs.content_hash }}-all-arm64

