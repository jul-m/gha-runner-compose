name: CI
run-name: "CI - ${{ github.event_name }} - #${{ github.run_number }}"

on:
  workflow_dispatch: {}
  pull_request:
    types: [synchronize, opened, reopened, edited]

permissions:
  contents: read
  packages: write
  actions: write

env:
  STAGING_IMG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging

concurrency:
  # Keyed by branch NAME, not SHA (changes every push, so cancel-in-progress would never match) nor
  # PR number (a push to main also fires pull_request:synchronize on the standing main->release PR:
  # both events must land in the same "main" group to be deduped). Dispatch runs for the bot's
  # update-runner-images branch share the group of that branch's pull_request run.
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-target:
    name: Resolve target ref
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      ref: ${{ steps.resolve.outputs.ref }}
      content_hash: ${{ steps.hash.outputs.content_hash }}
      exists_json: ${{ steps.exists.outputs.exists_json }}
      runner_tests: ${{ steps.mode.outputs.runner_tests }}
      category_matrix: ${{ steps.exists.outputs.category_matrix }}
    steps:
      - name: Detect runner test auth
        id: mode
        env:
          HAS_APP: ${{ secrets.GH_APP_CLIENT_ID != '' && secrets.GH_APP_KEY != '' }}
          HAS_PAT: ${{ secrets.ACTION_GH_TOKEN != '' }}
        run: |  # shell
          # Detect runner test auth: tests on self-hosted runners need the App or the PAT
          if [[ "${HAS_APP}" == "true" || "${HAS_PAT}" == "true" ]]; then
            echo "runner_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve ref to test
        id: resolve
        run: |  # shell
          # Resolve ref to test
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        if: steps.resolve.outputs.should_run == 'true'
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Compute content hash
        id: hash
        if: steps.resolve.outputs.should_run == 'true'
        run: |  # shell
          # Compute content hash
          HASH=$( { git rev-parse HEAD:Dockerfile; git rev-parse HEAD:docker-build; git rev-parse HEAD:docker-assets; git rev-parse HEAD:runner-images-src; } | sha256sum | cut -c1-16)
          echo "content_hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Check image cache
        id: exists
        if: steps.resolve.outputs.should_run == 'true'
        run: |  # shell
          # Check image cache
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BASE="ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging:content-${{ steps.hash.outputs.content_hash }}"
          RESULT="{}"
          INCLUDE="[]"
          for NAME in base essentials build cloud java nodejs python container dotnet; do
            if docker buildx imagetools inspect "${BASE}-${NAME}-amd64" >/dev/null 2>&1 && docker buildx imagetools inspect "${BASE}-${NAME}-arm64" >/dev/null 2>&1; then
              RESULT=$(jq -c --arg k "${NAME}" '. + {($k): true}' <<<"${RESULT}")
            else
              RESULT=$(jq -c --arg k "${NAME}" '. + {($k): false}' <<<"${RESULT}")
              if [[ "${NAME}" != "base" && "${NAME}" != "essentials" ]]; then
                INCLUDE=$(jq -c --arg cat "${NAME}" '. + [{"category":$cat,"arch":"amd64","host-runner":"ubuntu-24.04"},{"category":$cat,"arch":"arm64","host-runner":"ubuntu-24.04-arm"}]' <<<"${INCLUDE}")
              fi
            fi
          done
          echo "exists_json=${RESULT}" >> "$GITHUB_OUTPUT"
          echo "category_matrix=${INCLUDE}" >> "$GITHUB_OUTPUT"

  build-test-base:
    name: Build base - ${{ matrix.arch }}
    needs: check-target
    if: needs.check-target.outputs.should_run == 'true' && fromJSON(needs.check-target.outputs.exists_json).base != true
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    env:
      CONTENT_TAG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging:content-${{ needs.check-target.outputs.content_hash }}-base-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}
      - name: Build image
        uses: ./.github/actions/build-test-runner-image
        with:
          image-tag: gha-runner-compose-base:test-${{ matrix.arch }}
          build-target: base
          arch: ${{ matrix.arch }}
          runner-suffix: base-${{ matrix.arch }}
          test-job-name: Test base - ${{ matrix.arch }}
          own-job-name: Build base - ${{ matrix.arch }}
          app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_KEY }}
          admin-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.CONTENT_TAG }}
          push-image-refs: ${{ env.CONTENT_TAG }}

  test-base:
    name: Test base - ${{ matrix.arch }}
    needs: check-target
    if: needs.check-target.outputs.runner_tests == 'true' && needs.check-target.outputs.should_run == 'true' && fromJSON(needs.check-target.outputs.exists_json).base != true
    runs-on: test-runner-base-${{ matrix.arch }}-${{ github.run_id }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Fail fast when the build job did not start the runner
        if: startsWith(runner.name, 'rescue-')
        run: |  # shell
          # Fail fast: the build failed, a rescue agent picked this job up so it never stays queued
          echo "::error::The build job failed before the test runner started."
          exit 1

      # No COMPONENTS at this stage (base is OS/runner prereqs only) -
      # nothing for the per-component test system to run yet, so this stays a
      # plain sanity check of the base image itself.
      - run: echo "Hello from self-hosted runner (base / ${{ matrix.arch }})!" && uname -a && git --version

  build-test-essentials:
    name: Build all-essentials - ${{ matrix.arch }}
    needs: [check-target, build-test-base]
    if: always() && needs.check-target.outputs.should_run == 'true' && (needs.build-test-base.result == 'success' || fromJSON(needs.check-target.outputs.exists_json).base == true) && fromJSON(needs.check-target.outputs.exists_json).essentials != true
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    env:
      BASE_CONTENT_TAG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging:content-${{ needs.check-target.outputs.content_hash }}-base-${{ matrix.arch }}
      CONTENT_TAG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging:content-${{ needs.check-target.outputs.content_hash }}-essentials-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}
      - name: Build image
        uses: ./.github/actions/build-test-runner-image
        with:
          image-tag: gha-runner-compose:essentials-test-${{ matrix.arch }}
          build-target: runner-build
          arch: ${{ matrix.arch }}
          runner-suffix: essentials-${{ matrix.arch }}
          components: all-essentials
          additional-build-args: BASE_IMAGE=${{ env.BASE_CONTENT_TAG }}
          test-job-name: Test all-essentials - ${{ matrix.arch }}
          own-job-name: Build all-essentials - ${{ matrix.arch }}
          app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_KEY }}
          admin-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.CONTENT_TAG }}
          push-image-refs: ${{ env.CONTENT_TAG }}

  test-essentials:
    name: Test all-essentials - ${{ matrix.arch }}
    needs: [check-target, build-test-base]
    if: always() && needs.check-target.outputs.runner_tests == 'true' && needs.check-target.outputs.should_run == 'true' && (needs.build-test-base.result == 'success' || fromJSON(needs.check-target.outputs.exists_json).base == true) && fromJSON(needs.check-target.outputs.exists_json).essentials != true
    runs-on: test-runner-essentials-${{ matrix.arch }}-${{ github.run_id }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Fail fast when the build job did not start the runner
        if: startsWith(runner.name, 'rescue-')
        run: |  # shell
          # Fail fast: the build failed, a rescue agent picked this job up so it never stays queued
          echo "::error::The build job failed before the test runner started."
          exit 1

      - name: Run component tests
        run: /imagegeneration/docker-build/local-install/run-component-tests.sh

  build-test-category:
    name: Build all-${{ matrix.category }} - ${{ matrix.arch }}
    needs: [check-target, build-test-essentials]
    if: always() && needs.check-target.outputs.should_run == 'true' && (needs.build-test-essentials.result == 'success' || fromJSON(needs.check-target.outputs.exists_json).essentials == true) && fromJSON(needs.check-target.outputs.category_matrix)[0] != null
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    env:
      ESSENTIALS_CONTENT_TAG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging:content-${{ needs.check-target.outputs.content_hash }}-essentials-${{ matrix.arch }}
      CONTENT_TAG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging:content-${{ needs.check-target.outputs.content_hash }}-${{ matrix.category }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-target.outputs.category_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}
      - name: Build image
        uses: ./.github/actions/build-test-runner-image
        with:
          image-tag: gha-runner-compose:${{ matrix.category }}-test-${{ matrix.arch }}
          build-target: runner-build
          arch: ${{ matrix.arch }}
          runner-suffix: ${{ matrix.category }}-${{ matrix.arch }}
          components: all-${{ matrix.category }}
          additional-build-args: BASE_IMAGE=${{ env.ESSENTIALS_CONTENT_TAG }}
          test-job-name: Test all-${{ matrix.category }} - ${{ matrix.arch }}
          own-job-name: Build all-${{ matrix.category }} - ${{ matrix.arch }}
          app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_KEY }}
          admin-token: ${{ secrets.ACTION_GH_TOKEN }}
          content-tag: ${{ env.CONTENT_TAG }}
          push-image-refs: ${{ env.CONTENT_TAG }}

  test-category:
    name: Test all-${{ matrix.category }} - ${{ matrix.arch }}
    needs: [check-target, build-test-essentials]
    if: always() && needs.check-target.outputs.runner_tests == 'true' && needs.check-target.outputs.should_run == 'true' && (needs.build-test-essentials.result == 'success' || fromJSON(needs.check-target.outputs.exists_json).essentials == true) && fromJSON(needs.check-target.outputs.category_matrix)[0] != null
    runs-on: test-runner-${{ matrix.category }}-${{ matrix.arch }}-${{ github.run_id }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-target.outputs.category_matrix) }}
    steps:
      - name: Fail fast when the build job did not start the runner
        if: startsWith(runner.name, 'rescue-')
        run: |  # shell
          # Fail fast: the build failed, a rescue agent picked this job up so it never stays queued
          echo "::error::The build job failed before the test runner started."
          exit 1

      - name: Run component tests
        run: /imagegeneration/docker-build/local-install/run-component-tests.sh

  trigger-large-tiers:
    name: Trigger large tiers
    needs:
      - check-target
      - build-test-base
      - test-base
      - build-test-essentials
      - test-essentials
      - build-test-category
      - test-category
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'main' &&
      github.event.pull_request.base.ref == 'release' &&
      needs.check-target.outputs.should_run == 'true' &&
      needs.build-test-base.result != 'failure' && needs.build-test-base.result != 'cancelled' &&
      needs.test-base.result != 'failure' && needs.test-base.result != 'cancelled' &&
      needs.build-test-essentials.result != 'failure' && needs.build-test-essentials.result != 'cancelled' &&
      needs.test-essentials.result != 'failure' && needs.test-essentials.result != 'cancelled' &&
      needs.build-test-category.result != 'failure' && needs.build-test-category.result != 'cancelled' &&
      needs.test-category.result != 'failure' && needs.test-category.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ci-large-tiers.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |  # shell
          # Dispatch ci-large-tiers.yml
          gh workflow run ci-large-tiers.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.pull_request.head.ref }}" \
            -f source_sha="${{ github.event.pull_request.head.sha }}" \
            -f source_branch="${{ github.event.pull_request.head.ref }}" \
            -f source_pr_number="${{ github.event.pull_request.number }}"

  # Last job: writes the workflow summary and publishes the "CI result" check run (required by branch protection).
  status:
    name: CI Status
    needs:
      - check-target
      - build-test-base
      - test-base
      - build-test-essentials
      - test-essentials
      - build-test-category
      - test-category
      - trigger-large-tiers
    if: always() && needs.check-target.result != 'skipped' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Generate summary and publish check run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          RUNNER_TESTS: ${{ needs.check-target.outputs.runner_tests }}
          CONTENT_HASH: ${{ needs.check-target.outputs.content_hash }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |  # shell
          # Generate summary and publish check run: failure/cancelled job -> failure; skipped jobs are fine
          FAILED=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"${NEEDS}" | paste -sd, -)
          CANCELLED=$(jq -r 'to_entries[] | select(.value.result == "cancelled") | .key' <<<"${NEEDS}" | paste -sd, -)
          if [[ -n "${FAILED}" ]]; then
            CONCLUSION=failure; TITLE="Failed: ${FAILED}"
          elif [[ -n "${CANCELLED}" ]]; then
            CONCLUSION=cancelled; TITLE="Cancelled: ${CANCELLED}"
          elif [[ "${RUNNER_TESTS}" != "true" ]]; then
            CONCLUSION=success; TITLE="Passed, but runner tests were skipped (no GitHub App or ACTION_GH_TOKEN secret)"
          else
            CONCLUSION=success; TITLE="All jobs passed or were skipped"
          fi
          TABLE=$(jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"${NEEDS}")
          SUMMARY=$(printf '| Job | Result |\n|---|---|\n%s\n' "${TABLE}")
          {
            echo "## CI: ${TITLE}"
            echo
            echo "Commit \`${HEAD_SHA:0:7}\` - content hash \`${CONTENT_HASH:-n/a}\`"
            echo
            echo "${SUMMARY}"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='CI - Result' -f head_sha="${HEAD_SHA}" -f status=completed -f conclusion="${CONCLUSION}" \
            -f details_url="${RUN_URL}" -f 'output[title]'="${TITLE}" -f 'output[summary]'="${SUMMARY}" >/dev/null
          echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"

      - name: Fail when the workflow failed
        if: steps.check.outputs.conclusion != 'success'
        run: |  # shell
          # Fail when the workflow failed: mirror the check run's conclusion on this job
          echo "::error::CI: ${{ steps.check.outputs.conclusion }}, see the summary above."
          exit 1
