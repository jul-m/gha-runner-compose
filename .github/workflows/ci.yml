name: CI
run-name: "CI - ${{ github.event_name }} - #${{ github.run_number }}"

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, edited]
  push:
    branches: [main]
  # Runs after the automated upstream-sync workflow so its bot-authored PR
  # (update-runner-images) gets tested without needing manual "Approve and
  # run" clicks: pull_request runs from github-actions[bot] require approval
  # on every push (GitHub security change, June 2026), but workflow_run runs
  # inherit the trust of the triggering workflow (schedule/workflow_dispatch)
  # and are not subject to that gate.
  workflow_run:
    workflows: ["Update Upstream Sources"]
    types: [completed]

permissions:
  contents: read
  packages: write

# Concurrent runs on the same ref would race writes to the same GHCR cache
# tag per scope (and, for release PRs, the same staging image tag) - cancel
# the superseded run instead of letting them clobber each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves which ref to test. For workflow_run, that's always the fixed
  # `update-runner-images` branch used by Update Upstream Sources - skip
  # gracefully if it doesn't currently exist (e.g. nothing new to sync, or
  # the previous PR was just merged and the branch deleted).
  check-target:
    name: Resolve target ref
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      ref: ${{ steps.resolve.outputs.ref }}
      is_release_pr: ${{ steps.resolve.outputs.is_release_pr }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve ref to test
        id: resolve
        run: |  # shell
          # Resolve the ref to test
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if git ls-remote --exit-code --heads "${{ github.server_url }}/${{ github.repository }}" update-runner-images >/dev/null 2>&1; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "ref=update-runner-images" >> "$GITHUB_OUTPUT"
            else
              echo "No update-runner-images branch found; nothing to test."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          # A main -> release PR is the trigger that promotes tested images to
          # GHCR staging tags, picked up and retagged by publish-release.yml
          # once the PR is merged - no rebuild needed at that point.
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.base.ref }}" == "release" ]]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

  # ── BASE ──────────────────────────────────────────────────────────────────
  # Builds the OS + runner binary base image and boots a runner to validate it.
  build-test-base:
    name: Build and Test Base Image (${{ matrix.arch }})
    needs: check-target
    if: needs.check-target.outputs.should_run == 'true'
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build base image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose-base:test-${{ matrix.arch }}
          build-target: base
          runner-suffix: base-${{ matrix.arch }}
          cache-scope: base-${{ matrix.arch }}
          output-artifact-name: base-image-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (base / {0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          push-image-ref: ${{ needs.check-target.outputs.is_release_pr == 'true' && format('ghcr.io/{0}/gha-runner-compose-base:staging-pr{1}-{2}', github.repository_owner, needs.check-target.outputs.pr_number, matrix.arch) || '' }}

  test-base:
    name: Test Runner (base / ${{ matrix.arch }})
    needs: check-target
    if: needs.check-target.outputs.should_run == 'true'
    runs-on: ${{ format('test-runner-base-{0}-{1}', matrix.arch, github.run_id) }}
    # If the paired build job fails before starting the runner, this job would
    # otherwise sit queued for the default 6h job timeout with no way to ever
    # get picked up - fail fast instead.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Basic smoke test for base image
          echo "Hello from self-hosted runner (base / ${{ matrix.arch }})!"
          uname -a

  # ── ESSENTIALS ────────────────────────────────────────────────────────────
  # Builds from base, adds git, gh, yq, nodejs-lite, zstd, etc.
  build-test-essentials:
    name: Build and Test Essentials Image (${{ matrix.arch }})
    needs: [check-target, build-test-base]
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build essentials image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          base-artifact-name: base-image-${{ matrix.arch }}
          image-tag: gha-runner-compose:essentials-test-${{ matrix.arch }}
          build-target: runner-build
          runner-suffix: essentials-${{ matrix.arch }}
          cache-scope: essentials-${{ matrix.arch }}
          runner-components: all-essentials
          additional-build-args: |
            BASE_IMAGE=gha-runner-compose-base:test-${{ matrix.arch }}
          output-artifact-name: essentials-image-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (essentials / {0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          push-image-ref: ${{ needs.check-target.outputs.is_release_pr == 'true' && format('ghcr.io/{0}/gha-runner-compose:staging-essentials-pr{1}-{2}', github.repository_owner, needs.check-target.outputs.pr_number, matrix.arch) || '' }}

  test-essentials:
    name: Test Runner (essentials / ${{ matrix.arch }})
    needs: build-test-base
    runs-on: ${{ format('test-runner-essentials-{0}-{1}', matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Smoke test for essentials image
          echo "Hello from self-hosted runner (essentials / ${{ matrix.arch }})!"
          uname -a
          git --version
          gh --version
          yq --version

  # ── PARALLEL CATEGORY IMAGES ──────────────────────────────────────────────
  # Each category (all-<category>) builds in parallel from the essentials image.
  # Platform-specific components (x64-only) are silently skipped by the installer
  # on arm64 — no matrix exclusions needed.
  build-test-category:
    name: Build and Test ${{ matrix.category }} Image (${{ matrix.arch }})
    needs: [check-target, build-test-essentials]
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only the 7 categories actually published as standalone thematic
        # images (see docs/images.md / tools/prebuilt-images.csv). The other
        # runner-images-src categories (ruby, rust, databases, browser,
        # haskell, swift, php, web, julia, r, ...) only ship bundled inside
        # the medium/large/xlarge/all aggregate tiers, which nothing in this
        # workflow builds yet - testing them standalone here doesn't validate
        # anything that gets published.
        category:
          - build
          - cloud
          - java
          - nodejs
          - python
          - container
          - dotnet
        arch: [amd64, arm64]
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build ${{ matrix.category }} image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          base-artifact-name: essentials-image-${{ matrix.arch }}
          image-tag: gha-runner-compose:${{ matrix.category }}-test-${{ matrix.arch }}
          build-target: runner-build
          runner-suffix: ${{ matrix.category }}-${{ matrix.arch }}
          cache-scope: ${{ matrix.category }}-${{ matrix.arch }}
          runner-components: all-${{ matrix.category }}
          additional-build-args: |
            BASE_IMAGE=gha-runner-compose:essentials-test-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner ({0} / {1})', matrix.category, matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          push-image-ref: ${{ needs.check-target.outputs.is_release_pr == 'true' && format('ghcr.io/{0}/gha-runner-compose:staging-{1}-pr{2}-{3}', github.repository_owner, matrix.category, needs.check-target.outputs.pr_number, matrix.arch) || '' }}

  test-category:
    name: Test Runner (${{ matrix.category }} / ${{ matrix.arch }})
    needs: build-test-essentials
    runs-on: ${{ format('test-runner-{0}-{1}-{2}', matrix.category, matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category:
          - build
          - cloud
          - java
          - nodejs
          - python
          - container
          - dotnet
        arch: [amd64, arm64]
    steps:
      - name: Run smoke test
        run: |  # shell
          # Smoke test for ${{ matrix.category }} image
          echo "Hello from self-hosted runner (${{ matrix.category }} / ${{ matrix.arch }})!"
          uname -a
