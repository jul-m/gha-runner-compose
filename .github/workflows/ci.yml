name: CI
run-name: "CI - ${{ github.event_name }} - #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      build_large_tiers:
        description: 'Also build/test medium, large, xlarge, all (needs the self-hosted runner - see docs/building.md)'
        required: false
        type: boolean
        default: false
  pull_request:
    types: [synchronize, opened, reopened, edited]
  push:
    branches: [main]
  # Runs after the automated upstream-sync workflow so its bot-authored PR
  # (update-runner-images) gets tested without needing manual "Approve and
  # run" clicks: pull_request runs from github-actions[bot] require approval
  # on every push (GitHub security change, June 2026), but workflow_run runs
  # inherit the trust of the triggering workflow (schedule/workflow_dispatch)
  # and are not subject to that gate.
  workflow_run:
    workflows: ["Update Upstream Sources"]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  # Every base/essentials/build-category image is pushed under this run-scoped
  # GHCR tag once tested, so the next stage pulls it directly as its BASE_IMAGE
  # build-arg instead of the old artifact save/upload/download/load round trip
  # (a `type=registry` cache-to export isn't a pullable image on its own -
  # confirmed: `docker pull` on a cache-scope tag fails with "mismatched image
  # rootfs and manifest layers"). Cleaned up by the cleanup-ci-images job.
  CI_RUN_TAG: ci-${{ github.run_id }}

# Concurrent runs on the same ref would race writes to the same GHCR cache
# tag per scope (and, for release PRs, the same staging image tag) - cancel
# the superseded run instead of letting them clobber each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves which ref to test. For workflow_run, that's always the fixed
  # `update-runner-images` branch used by Update Upstream Sources - skip
  # gracefully if it doesn't currently exist (e.g. nothing new to sync, or
  # the previous PR was just merged and the branch deleted).
  check-target:
    name: Resolve target ref
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      ref: ${{ steps.resolve.outputs.ref }}
      is_release_pr: ${{ steps.resolve.outputs.is_release_pr }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      should_build_large_tiers: ${{ steps.resolve.outputs.should_build_large_tiers }}
    steps:
      - name: Resolve ref to test
        id: resolve
        run: |  # shell
          # Resolve the ref to test
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if git ls-remote --exit-code --heads "${{ github.server_url }}/${{ github.repository }}" update-runner-images >/dev/null 2>&1; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "ref=update-runner-images" >> "$GITHUB_OUTPUT"
            else
              echo "No update-runner-images branch found; nothing to test."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" \
                  && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            # This repo's CI never runs for fork-originated PRs, full stop - not
            # just the self-hosted jobs below. A contributor validates their
            # change on their own fork's Actions (same workflow file, their own
            # compute/secrets context); this repo only runs CI for its own
            # branches and PRs.
            echo "Fork-originated PR - CI runs on the fork's own Actions, not here."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          # A main -> release PR is the trigger that promotes tested images to
          # GHCR staging tags, picked up and retagged by publish-release.yml
          # once the PR is merged - no rebuild needed at that point. Also
          # requires the PR's head to be this same repo (not a fork): this
          # flag gates jobs that run on our self-hosted runner, and a
          # fork-originated PR must never be able to trigger code execution
          # there.
          if [[ "${{ github.event_name }}" == "pull_request" \
                && "${{ github.event.pull_request.base.ref }}" == "release" \
                && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

          # medium/large/xlarge/all are tens of GB uncompressed - far beyond the
          # 14GB disk on standard GitHub-hosted runners - so they only build on
          # the self-hosted runner, and only when explicitly requested (manual
          # workflow_dispatch toggle) or required (a same-repo main -> release
          # PR, which must validate everything before promoting a release).
          if [[ "${{ github.event.inputs.build_large_tiers }}" == "true" || "${{ github.event.pull_request.base.ref }}" == "release" ]] \
             && [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "should_build_large_tiers=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build_large_tiers=false" >> "$GITHUB_OUTPUT"
          fi

  # ── BASE ──────────────────────────────────────────────────────────────────
  # Builds the OS + runner binary base image and boots a runner to validate it.
  build-test-base:
    name: Build and Test Base Image (${{ matrix.arch }})
    needs: check-target
    if: needs.check-target.outputs.should_run == 'true'
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build base image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose-base:test-${{ matrix.arch }}
          build-target: base
          runner-suffix: base-${{ matrix.arch }}
          cache-scope: base-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (base / {0})', matrix.arch) }}
          own-job-name: ${{ format('Build and Test Base Image ({0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          push-image-refs: |
            ghcr.io/${{ github.repository_owner }}/gha-runner-compose-base:${{ env.CI_RUN_TAG }}-${{ matrix.arch }}
            ${{ needs.check-target.outputs.is_release_pr == 'true' && format('ghcr.io/{0}/gha-runner-compose-base:staging-pr{1}-{2}', github.repository_owner, needs.check-target.outputs.pr_number, matrix.arch) || '' }}

  test-base:
    name: Test Runner (base / ${{ matrix.arch }})
    needs: check-target
    if: needs.check-target.outputs.should_run == 'true'
    runs-on: ${{ format('test-runner-base-{0}-{1}', matrix.arch, github.run_id) }}
    # If the paired build job fails before starting the runner, this job would
    # otherwise sit queued for the default 6h job timeout with no way to ever
    # get picked up - fail fast instead.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Basic smoke test for base image
          echo "Hello from self-hosted runner (base / ${{ matrix.arch }})!"
          uname -a

  # ── ESSENTIALS ────────────────────────────────────────────────────────────
  # Builds from base, adds git, gh, yq, nodejs-lite, zstd, etc.
  build-test-essentials:
    name: Build and Test Essentials Image (${{ matrix.arch }})
    needs: [check-target, build-test-base]
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build essentials image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose:essentials-test-${{ matrix.arch }}
          build-target: runner-build
          runner-suffix: essentials-${{ matrix.arch }}
          cache-scope: essentials-${{ matrix.arch }}
          runner-components: all-essentials
          additional-build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gha-runner-compose-base:${{ env.CI_RUN_TAG }}-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner (essentials / {0})', matrix.arch) }}
          own-job-name: ${{ format('Build and Test Essentials Image ({0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          push-image-refs: |
            ghcr.io/${{ github.repository_owner }}/gha-runner-compose:${{ env.CI_RUN_TAG }}-essentials-${{ matrix.arch }}
            ${{ needs.check-target.outputs.is_release_pr == 'true' && format('ghcr.io/{0}/gha-runner-compose:staging-essentials-pr{1}-{2}', github.repository_owner, needs.check-target.outputs.pr_number, matrix.arch) || '' }}

  test-essentials:
    name: Test Runner (essentials / ${{ matrix.arch }})
    needs: build-test-base
    runs-on: ${{ format('test-runner-essentials-{0}-{1}', matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Smoke test for essentials image
          echo "Hello from self-hosted runner (essentials / ${{ matrix.arch }})!"
          uname -a
          git --version
          gh --version
          yq --version

  # ── PARALLEL CATEGORY IMAGES ──────────────────────────────────────────────
  # Each category (all-<category>) builds in parallel from the essentials image.
  # Platform-specific components (x64-only) are silently skipped by the installer
  # on arm64 — no matrix exclusions needed.
  build-test-category:
    name: Build and Test ${{ matrix.category }} Image (${{ matrix.arch }})
    needs: [check-target, build-test-essentials]
    runs-on: ${{ matrix.host-runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only the 7 categories actually published as standalone thematic
        # images (see docs/images.md / tools/prebuilt-images.csv). The other
        # runner-images-src categories (ruby, rust, databases, browser,
        # haskell, swift, php, web, julia, r, ...) only ship bundled inside
        # the medium/large/xlarge/all aggregate tiers, which nothing in this
        # workflow builds yet - testing them standalone here doesn't validate
        # anything that gets published.
        category:
          - build
          - cloud
          - java
          - nodejs
          - python
          - container
          - dotnet
        arch: [amd64, arm64]
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Build ${{ matrix.category }} image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose:${{ matrix.category }}-test-${{ matrix.arch }}
          build-target: runner-build
          runner-suffix: ${{ matrix.category }}-${{ matrix.arch }}
          cache-scope: ${{ matrix.category }}-${{ matrix.arch }}
          runner-components: all-${{ matrix.category }}
          additional-build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gha-runner-compose:${{ env.CI_RUN_TAG }}-essentials-${{ matrix.arch }}
          test-job-name: ${{ format('Test Runner ({0} / {1})', matrix.category, matrix.arch) }}
          own-job-name: ${{ format('Build and Test {0} Image ({1})', matrix.category, matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}
          # Only "build" feeds the medium/large/xlarge/all chain (see build-test-large-tiers) - the other
          # categories have nothing downstream in this run, so they skip the CI-run-scoped push entirely.
          push-image-refs: |
            ${{ matrix.category == 'build' && format('ghcr.io/{0}/gha-runner-compose:{1}-build-{2}', github.repository_owner, env.CI_RUN_TAG, matrix.arch) || '' }}
            ${{ needs.check-target.outputs.is_release_pr == 'true' && format('ghcr.io/{0}/gha-runner-compose:staging-{1}-pr{2}-{3}', github.repository_owner, matrix.category, needs.check-target.outputs.pr_number, matrix.arch) || '' }}

  test-category:
    name: Test Runner (${{ matrix.category }} / ${{ matrix.arch }})
    needs: build-test-essentials
    runs-on: ${{ format('test-runner-{0}-{1}-{2}', matrix.category, matrix.arch, github.run_id) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        category:
          - build
          - cloud
          - java
          - nodejs
          - python
          - container
          - dotnet
        arch: [amd64, arm64]
    steps:
      - name: Run smoke test
        run: |  # shell
          # Smoke test for ${{ matrix.category }} image
          echo "Hello from self-hosted runner (${{ matrix.category }} / ${{ matrix.arch }})!"
          uname -a

  # ── LARGE TIERS (medium/large/xlarge/all) ───────────────────────────────────
  # These are 20-62GB uncompressed - far beyond the 14GB disk on standard
  # GitHub-hosted runners - so they only run on a self-hosted runner, and only
  # when explicitly requested or required (see should_build_large_tiers above).
  # Each tier builds from the previous tier's local image directly (no
  # inter-job artifact hand-off): they're all sequential steps in one job per
  # arch, so the self-hosted runner's own Docker image store carries state
  # from one step to the next.
  build-test-large-tiers:
    name: Build and Test Large Tiers (${{ matrix.arch }})
    needs: [check-target, build-test-category]
    if: needs.check-target.outputs.should_build_large_tiers == 'true'
    runs-on: [self-hosted, gha-runner-compose-large-images]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # gha-runner-compose predates this workflow and its GHCR "Manage
          # Actions access" grant doesn't cover the default github.token (see
          # the composite action's "Log in to GHCR (image push)" step for the
          # same issue and why the fix is switching tokens, not scopes).
          password: ${{ secrets.ACTION_GH_TOKEN }}

      - name: Build and smoke-test medium image
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_GH_TOKEN }}
        run: |  # shell
          # Build medium on top of the "build" category image (pulled directly from
          # GHCR as the BASE_IMAGE - already built and tested by build-test-category)
          docker buildx build --platform "${PLATFORM}" --target runner-build --load \
            --build-arg "BASE_IMAGE=${REGISTRY}/gha-runner-compose:${{ env.CI_RUN_TAG }}-build-${{ matrix.arch }}" \
            --build-arg RUNNER_COMPONENTS=all-cloud,all-nodejs,all-java,all-container,all-python,all-rust \
            --cache-from "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:medium-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:medium-${{ matrix.arch }},mode=max" \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            -t gha-runner-compose:medium-test-${{ matrix.arch }} .
          docker run --rm --entrypoint bash gha-runner-compose:medium-test-${{ matrix.arch }} -c 'uname -a && command -v aws && command -v java && command -v python3'

      - name: Build and smoke-test large image
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_GH_TOKEN }}
        run: |  # shell
          # Build large on top of medium
          docker buildx build --platform "${PLATFORM}" --target runner-build --load \
            --build-arg BASE_IMAGE=gha-runner-compose:medium-test-${{ matrix.arch }} \
            --build-arg RUNNER_COMPONENTS=all-dotnet,all-php,all-ruby,all-r,all-julia,pipx-packages,all-web,all-databases \
            --cache-from "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:large-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:large-${{ matrix.arch }},mode=max" \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            -t gha-runner-compose:large-test-${{ matrix.arch }} .
          docker run --rm --entrypoint bash gha-runner-compose:large-test-${{ matrix.arch }} -c 'uname -a && command -v dotnet && command -v ruby'

      - name: Build and smoke-test xlarge image
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_GH_TOKEN }}
        run: |  # shell
          # Build xlarge on top of large
          docker buildx build --platform "${PLATFORM}" --target runner-build --load \
            --build-arg BASE_IMAGE=gha-runner-compose:large-test-${{ matrix.arch }} \
            --build-arg RUNNER_COMPONENTS=all-swift,actions-cache,codeql-bundle,firefox,selenium \
            --cache-from "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:xlarge-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:xlarge-${{ matrix.arch }},mode=max" \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            -t gha-runner-compose:xlarge-test-${{ matrix.arch }} .
          docker run --rm --entrypoint bash gha-runner-compose:xlarge-test-${{ matrix.arch }} -c 'uname -a && command -v firefox'

      - name: Build and smoke-test all image
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_GH_TOKEN }}
        run: |  # shell
          # Build all (every remaining component) on top of xlarge
          docker buildx build --platform "${PLATFORM}" --target runner-build --load \
            --build-arg BASE_IMAGE=gha-runner-compose:xlarge-test-${{ matrix.arch }} \
            --build-arg RUNNER_COMPONENTS=all \
            --cache-from "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:all-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${REGISTRY}/gha-runner-compose-cache:all-${{ matrix.arch }},mode=max" \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            -t gha-runner-compose:all-test-${{ matrix.arch }} .
          docker run --rm --entrypoint bash gha-runner-compose:all-test-${{ matrix.arch }} -c 'uname -a'

      - name: Push staged images for release PR
        if: needs.check-target.outputs.is_release_pr == 'true'
        run: |  # shell
          # Stage each tier under a PR-numbered tag; publish-release.yml promotes
          # these to the release tag once the PR is merged, no rebuild needed.
          for TIER in medium large xlarge all; do
            docker tag "gha-runner-compose:${TIER}-test-${{ matrix.arch }}" \
              "${REGISTRY}/gha-runner-compose:staging-${TIER}-pr${{ needs.check-target.outputs.pr_number }}-${{ matrix.arch }}"
            docker push "${REGISTRY}/gha-runner-compose:staging-${TIER}-pr${{ needs.check-target.outputs.pr_number }}-${{ matrix.arch }}"
          done

      - name: Clean up local images
        if: always()
        run: |  # shell
          # Free disk on the self-hosted runner for the next run
          docker rmi -f \
            "${REGISTRY}/gha-runner-compose:${{ env.CI_RUN_TAG }}-build-${{ matrix.arch }}" \
            "gha-runner-compose:medium-test-${{ matrix.arch }}" \
            "gha-runner-compose:large-test-${{ matrix.arch }}" \
            "gha-runner-compose:xlarge-test-${{ matrix.arch }}" \
            "gha-runner-compose:all-test-${{ matrix.arch }}" \
            2>/dev/null || true

  # ── CLEANUP ──────────────────────────────────────────────────────────────────
  # base/essentials/build push a CI_RUN_TAG-scoped GHCR version purely so the
  # next stage in *this* run can pull it as a BASE_IMAGE - once every consumer
  # has finished (or failed), that version has no further purpose.
  cleanup-ci-images:
    name: Clean up CI-run-scoped images
    needs: [check-target, build-test-base, build-test-essentials, build-test-category, build-test-large-tiers]
    if: always() && needs.check-target.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete run-scoped GHCR versions
        env:
          GH_TOKEN: ${{ secrets.ACTION_GH_TOKEN }}
        run: |  # shell
          # Best-effort: package-version deletion needs more than packages:write
          # on a personal-account-owned package (admin rights on the package),
          # so this may need ACTION_GH_TOKEN to carry a broader scope than the
          # default GITHUB_TOKEN provides. A failure here just means the
          # run-scoped tags accumulate until manually pruned - not fatal.
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "ℹ️ No token available; skipping cleanup."
            exit 0
          fi

          for PACKAGE in gha-runner-compose-base gha-runner-compose; do
            VERSION_IDS=$(gh api --paginate "/user/packages/container/${PACKAGE}/versions" \
              --jq ".[] | select(.metadata.container.tags[]? | startswith(\"${{ env.CI_RUN_TAG }}-\")) | .id" 2>/dev/null || true)
            for ID in ${VERSION_IDS}; do
              echo "Deleting ${PACKAGE} version ${ID}"
              gh api --method DELETE "/user/packages/container/${PACKAGE}/versions/${ID}" 2>/dev/null \
                || echo "  ⚠️ Failed to delete ${PACKAGE} version ${ID} (likely a permissions gap, see comment above)."
            done
          done
