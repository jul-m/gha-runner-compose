name: Publish Release

# Runs when a main -> release PR is merged. It does not rebuild anything: every
# image was already built (or reused unchanged) and tested by ci.yml /
# ci-large-tiers.yml, staged to GHCR under a content-addressed
# `content-<hash>-<name>-<arch>` tag (see those workflows' "Compute content
# hash" step - identical formula, so the same source tree always yields the
# same tag here). This combines the two per-arch content tags into one
# multi-arch manifest under the release date tag, points "-latest" at it, and
# publishes the finished GitHub release directly - no separate prerelease /
# manual finalize step. A merge into `release` is itself the human approval
# gate; nothing further needs verifying after that.
run-name: "Publish Release - #${{ github.run_number }}"

on:
  push:
    branches: [release]
  # Manual re-run against the current tip of release - e.g. to retry after a
  # failure, or to (re-)publish a merge that landed under an older version of
  # this workflow. Idempotent: re-running for the same date-tag updates the
  # existing tag/release in place instead of failing on "already exists".
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # The only writer to these two: everything transient (release-PR staging,
  # intra-run hand-off) lives in gha-runner-compose-staging instead (see ci.yml).
  BASE_IMG_NAME: gha-runner-compose-base:u24.04
  RUNNER_IMG_NAME: gha-runner-compose:u24.04
  STAGING_IMG: ghcr.io/${{ github.repository_owner }}/gha-runner-compose-staging
  # Matches ci.yml's build-test-category matrix (see tools/prebuilt-images.csv).
  PUBLISHED_CATEGORIES: build cloud java nodejs python container dotnet
  # Matches ci.yml's build-test-large-tiers job. A same-repo main -> release PR
  # always triggers should_build_large_tiers, so these are staged on every
  # release and safe to always promote here.
  LARGE_TIERS: medium large xlarge all

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote staged images to release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve merged PR and release tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |  # shell
          # Resolve the PR that was just merged into release, and the release date tag
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "❌ No pull request found for commit ${{ github.sha }}. Publish Release only supports merges via a main -> release PR."
            exit 1
          fi
          TAG=$(date +%y%m%d)
          echo "Resolved PR #${PR_NUMBER}, release tag ${TAG}"
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      # Same formula as ci.yml/ci-large-tiers.yml's "Compute content hash" -
      # the merge into release doesn't change Dockerfile/docker-build/
      # docker-assets/runner-images-src content, so this always matches the
      # content tag those workflows already staged, whether it was built
      # fresh during this PR or reused unchanged from an earlier run.
      - name: Compute content hash
        id: hash
        run: |  # shell
          # Compute content hash
          HASH=$( { git rev-parse HEAD:Dockerfile; git rev-parse HEAD:docker-build; git rev-parse HEAD:docker-assets; git rev-parse HEAD:runner-images-src; } | sha256sum | cut -c1-16)
          echo "content_hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote base image
        env:
          CONTENT_HASH: ${{ steps.hash.outputs.content_hash }}
          TAG: ${{ steps.resolve.outputs.TAG }}
        run: |  # shell
          # Combine the amd64/arm64 content-tagged staging images into one multi-arch manifest
          docker buildx imagetools create \
            --tag "${REGISTRY}/${BASE_IMG_NAME}-${TAG}" \
            "${STAGING_IMG}:content-${CONTENT_HASH}-base-amd64" \
            "${STAGING_IMG}:content-${CONTENT_HASH}-base-arm64"

      - name: Promote essentials and category images
        env:
          CONTENT_HASH: ${{ steps.hash.outputs.content_hash }}
          TAG: ${{ steps.resolve.outputs.TAG }}
        run: |  # shell
          # Combine the amd64/arm64 content-tagged staging images into one multi-arch manifest per image
          for SHORT in essentials ${PUBLISHED_CATEGORIES} ${LARGE_TIERS}; do
            echo "Promoting ${SHORT}"
            docker buildx imagetools create \
              --tag "${REGISTRY}/${RUNNER_IMG_NAME}-${SHORT}-${TAG}" \
              "${STAGING_IMG}:content-${CONTENT_HASH}-${SHORT}-amd64" \
              "${STAGING_IMG}:content-${CONTENT_HASH}-${SHORT}-arm64"
          done

      - name: Tag images with latest
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
        run: |  # shell
          # Point "-latest" at what was just promoted above - manifest-only,
          # no blobs re-uploaded (imagetools create just writes a new tag).
          docker buildx imagetools create "${REGISTRY}/${BASE_IMG_NAME}-${TAG}" --tag "${REGISTRY}/${BASE_IMG_NAME}-latest"
          for SHORT in essentials ${PUBLISHED_CATEGORIES} ${LARGE_TIERS}; do
            docker buildx imagetools create "${REGISTRY}/${RUNNER_IMG_NAME}-${SHORT}-${TAG}" --tag "${REGISTRY}/${RUNNER_IMG_NAME}-${SHORT}-latest"
          done

      - name: Tag the release commit
        run: |  # shell
          # Tag the release commit - force so a manual re-run for the same
          # date-tag (retry, or re-publishing a merge from before this
          # workflow existed) moves it instead of failing on "already exists".
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.resolve.outputs.TAG }}" "${{ github.sha }}"
          git push --force origin "${{ steps.resolve.outputs.TAG }}"

      - name: Resolve release metadata
        id: meta
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
        run: |  # shell
          # Derive release date and links from the tag, and pin the
          # runner-images-src commit this release was built against
          SUBMODULE_COMMIT=$(git rev-parse HEAD:runner-images-src)
          RELEASE_DATE="${TAG:4:2}/${TAG:2:2}/20${TAG:0:2}"
          REPO_LINK="${{ github.server_url }}/${{ github.repository }}/tree/${TAG}"
          {
            echo "submodule_commit=${SUBMODULE_COMMIT}"
            echo "release_date=${RELEASE_DATE}"
            echo "repo_link=${REPO_LINK}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: actions/github-script@v8
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.TAG }}
          RELEASE_DATE: ${{ steps.meta.outputs.release_date }}
          REPO_LINK: ${{ steps.meta.outputs.repo_link }}
          SUBMODULE_COMMIT: ${{ steps.meta.outputs.submodule_commit }}
        with:
          script: |  # javascript
            const fs = require('fs');
            const tag = process.env.TAG;
            const releaseDate = process.env.RELEASE_DATE;
            const repoLink = process.env.REPO_LINK;
            const registry = process.env.REGISTRY;
            const baseName = process.env.BASE_IMG_NAME;
            const runnerName = process.env.RUNNER_IMG_NAME;
            const submoduleCommit = process.env.SUBMODULE_COMMIT;

            let notes = `## Release ${tag}\n\n`
            notes += `- **Release Date:** ${releaseDate}\n`
            notes += `- **Source:** ${repoLink}\n`
            notes += `- **Docs:** [Available images](${repoLink}/docs/images.md) · [Components](${repoLink}/docs/components.md)\n`
            notes += `- **runner-images version:** https://github.com/actions/runner-images/tree/${submoduleCommit}\n\n`

            const csv = fs.readFileSync('tools/prebuilt-images.csv','utf8');
            const lines = csv.split('\n').slice(1).filter(Boolean);

            // Direct tag -> html_url map (no split/parse of the tag itself),
            // so each image resolves to exactly the one tag this release
            // just pushed - never an older release's tag for the same image.
            let htmlUrlByTag = {};
            try {
              const { execSync } = require('child_process');
              const headers = "-H \"Accept: application/vnd.github+json\" -H \"X-GitHub-Api-Version: 2022-11-28\" --paginate";
              const jq = 'reduce .[] as $item ({}; reduce ($item.metadata.container.tags[]) as $t (.; .[$t] = $item.html_url))';

              const getTagUrls = (packageName) => {
                const cmd = `gh api "/user/packages/container/${packageName}/versions" ${headers} --jq '${jq}'`;
                const out = execSync(cmd, { encoding: 'utf8', env: Object.assign({}, process.env, { GH_TOKEN: process.env.GITHUB_TOKEN }) }).trim();
                return out ? JSON.parse(out) : {};
              };

              htmlUrlByTag = Object.assign(getTagUrls('gha-runner-compose'), getTagUrls('gha-runner-compose-base'));
            } catch (e) { /* ignore, fall back to a plain registry link below */ }

            notes += `## Images\n\n`
            notes += `| Image | Pull reference |\n|---|---|\n`

            const baseLine = lines.find(line => line.startsWith('base,'));
            if (baseLine) {
              const fullTag = `u24.04-${tag}`;
              const img_ref = `${registry}/${baseName}-${tag}`;
              const htmlUrl = htmlUrlByTag[fullTag] || `https://${img_ref}`;
              notes += `| **base** | [\`${img_ref}\`](${htmlUrl}) |\n`;
            }

            for (const line of lines) {
              const [short] = line.split(',');
              if (short === 'base') continue;
              const fullTag = `u24.04-${short}-${tag}`;
              const img_ref = `${registry}/${runnerName}-${short}-${tag}`;
              const htmlUrl = htmlUrlByTag[fullTag] || `https://${img_ref}`;
              notes += `| ${short} | [\`${img_ref}\`](${htmlUrl}) |\n`;
            }

            core.setOutput('notes', notes);

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.TAG }}
          RELEASE_DATE: ${{ steps.meta.outputs.release_date }}
        run: |  # shell
          # Published directly as the latest release - the main -> release
          # merge is itself the approval gate, so there is nothing left to
          # verify before this goes live. A release under this date-tag may
          # already exist (manual re-run, or one created by an older version
          # of this workflow) - update it in place rather than failing.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - updating in place."
            gh release edit "${TAG}" \
              --title "${TAG} (${RELEASE_DATE})" \
              --latest \
              --prerelease=false \
              --notes "${{ steps.generate.outputs.notes }}"
          else
            gh release create "${TAG}" \
              --target "${{ github.sha }}" \
              --title "${TAG} (${RELEASE_DATE})" \
              --latest \
              --notes "${{ steps.generate.outputs.notes }}"
          fi

          echo "✅ Release ${TAG} published"
