name: Test Runner Images
run-name: "Test Runner Images - ${{ github.event_name }} - #${{ github.run_number }}"

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, edited]
  # Runs after the automated upstream-sync workflow so its bot-authored PR
  # (update-runner-images) gets tested without needing manual "Approve and
  # run" clicks: pull_request runs from github-actions[bot] require approval
  # on every push (GitHub security change, June 2026), but workflow_run runs
  # inherit the trust of the triggering workflow (schedule/workflow_dispatch)
  # and are not subject to that gate.
  workflow_run:
    workflows: ["Update Upstream Sources"]
    types: [completed]

jobs:
  # Resolves which ref to test. For workflow_run, that's always the fixed
  # `update-runner-images` branch used by Update Upstream Sources - skip
  # gracefully if it doesn't currently exist (e.g. nothing new to sync, or
  # the previous PR was just merged and the branch deleted).
  check-target:
    name: Resolve target ref
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve ref to test
        id: resolve
        run: |  # shell
          # Resolve the ref to test
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if git ls-remote --exit-code --heads "${{ github.server_url }}/${{ github.repository }}" update-runner-images >/dev/null 2>&1; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "ref=update-runner-images" >> "$GITHUB_OUTPUT"
            else
              echo "No update-runner-images branch found; nothing to test."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  # TEST BASE IMAGE
  test-base-runner:
    name: Build+Start Runner (base / ${{ matrix.arch }})
    needs: check-target
    if: needs.check-target.outputs.should_run == 'true'
    runs-on: ${{ matrix.host-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Validate base image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose-base:test
          build-target: base
          runner-suffix: ${{ format('base-{0}', matrix.arch) }}
          test-job-name: ${{ format('Test Runner (base / {0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}

  test-base:
    name: Test Runner (base / ${{ matrix.arch }})
    runs-on: ${{ format('test-runner-base-{0}-{1}', matrix.arch, github.run_id) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Basic job test for base / ${{ matrix.arch }}
          echo "Hello from self-hosted runner (base / ${{ matrix.arch }})!"
          echo "Runner is working correctly."
          uname -a

  # TEST ESSENTIALS IMAGE
  test-essentials-runner:
    name: Build+Start Runner (essentials / ${{ matrix.arch }})
    needs:
      - check-target
      - test-base-runner
      - test-base
    runs-on: ${{ matrix.host-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host-runner: ubuntu-24.04
          - arch: arm64
            host-runner: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-target.outputs.ref }}

      - name: Validate essentials image (${{ matrix.arch }})
        uses: ./.github/actions/test-runner-image
        with:
          image-tag: gha-runner-compose:essentials-test
          build-target: runner-build
          runner-suffix: ${{ format('essentials-{0}', matrix.arch) }}
          runner-components: all-essentials
          test-job-name: ${{ format('Test Runner (essentials / {0})', matrix.arch) }}
          github-token: ${{ secrets.ACTION_GH_TOKEN }}

  test-essentials:
    name: Test Runner (essentials / ${{ matrix.arch }})
    needs:
      - test-base-runner
      - test-base
    runs-on: ${{ format('test-runner-essentials-{0}-{1}', matrix.arch, github.run_id) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Run basic test
        run: |  # shell
          # Basic job test for essentials / ${{ matrix.arch }}
          echo "Hello from self-hosted runner (essentials / ${{ matrix.arch }})!"
          echo "Runner is working correctly."
          uname -a