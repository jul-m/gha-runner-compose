name: Update Upstream Sources
run-name: "Update Upstream Sources - ${{ github.event_name }} - #${{ github.run_number }}"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # Run daily

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

jobs:
  update-runner-images-src:
    name: Update runner-images-src submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: true

      - name: Config & Update submodule
        run: |  # shell
          # Config & Update submodule
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote
          git add runner-images-src

      - name: Check for submodule changes
        id: check_changes
        run: |  # shell
          # Check for changes in the submodule
          echo "HEAD submodule commit: $(git rev-parse HEAD:runner-images-src)"
          echo "Index submodule commit: $(git rev-parse :runner-images-src)"
          set +e
          git diff --cached --quiet runner-images-src
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "No changes detected in submodule"
            echo "changes=false" >> $GITHUB_OUTPUT
          elif [ $exit_code -eq 1 ]; then
            echo "Changes detected in submodule"
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "Error checking submodule changes: exit code $exit_code" >&2
            exit $exit_code
          fi

      - name: Copy sources
        if: steps.check_changes.outputs.changes == 'true'
        id: copy_sources
        run: |  # shell
          # Mirror Ubuntu scripts (rsync --delete prunes files removed upstream,
          # unlike cp -r which left orphaned scripts around indefinitely)
          rsync -a --delete --exclude=toolset.json --exclude=LICENCE \
            runner-images-src/images/ubuntu/scripts/ docker-assets/from-upstream/
          # Copy toolset
          cp runner-images-src/images/ubuntu/toolsets/toolset-2404.json docker-assets/from-upstream/toolset.json

          submodule_ref=$(git rev-parse --short :runner-images-src)
          echo "submodule_ref=$submodule_ref" >> $GITHUB_OUTPUT

          # Check if docker-assets/from-upstream has changes
          if git diff --quiet -- docker-assets/from-upstream; then
            echo "No changes detected in docker-assets/from-upstream: commit new sub-module ref: $submodule_ref"
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in docker-assets/from-upstream (ref: $submodule_ref): create a PR"
            echo "modified=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App token
        id: app_token
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}

      - name: Create or update pull request
        id: cpr
        if: steps.copy_sources.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # App token (not GITHUB_TOKEN): the PR then triggers the pull_request CI without approval
          token: ${{ steps.app_token.outputs.token }}
          branch: update-runner-images
          title: Update runner images sources
          body: Automated update of runner images sources from upstream.
          commit-message: Update runner images sources
          # Default author is the triggering user (the cron owner), which shows up as co-author
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true

      - name: Run CI on the submodule bump through a temporary branch
        id: ci_check
        if: steps.check_changes.outputs.changes == 'true' && steps.copy_sources.outputs.modified == 'false'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUBMODULE_REF: ${{ steps.copy_sources.outputs.submodule_ref }}
        run: |  # shell
          # The base branch only accepts commits that already carry a passing "CI - Result": dispatch ci.yml on a
          # temporary branch so the check is attached to the exact SHA that gets fast-forwarded afterwards
          set -euo pipefail
          branch=tmp/update-runner-images-src
          trap 'git push origin --delete "$branch" || true' EXIT

          git commit -m "Update runner-images-src submodule to ${SUBMODULE_REF}"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/${branch}"
          gh workflow run ci.yml --ref "$branch"

          while true; do
            read -r total pending failed <<< "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --jq \
              '[.check_runs[] | select(.name == "CI - Result")] | "\(length) \([.[] | select(.status != "completed")] | length) \([.[] | select(.conclusion != "success")] | length)"')"
            echo "CI - Result on ${sha}: total=${total} pending=${pending} not-success=${failed}"
            if [ "$total" -eq 0 ] || [ "$pending" -gt 0 ]; then
              sleep 60
            elif [ "$failed" -gt 0 ]; then
              echo "::error::CI - Result failed on ${sha}"
              exit 1
            else
              break
            fi
          done

      # Fresh token: the one from the first step expires after 1 hour, shorter than a CI run
      - name: Generate GitHub App token for the fast-forward
        id: ff_token
        if: steps.ci_check.outcome == 'success'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}

      - name: Fast-forward the base branch to the checked commit
        if: steps.ci_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.ff_token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ steps.ci_check.outputs.sha }}
        run: |  # shell
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 "$remote" "$BASE_BRANCH"
          git merge-base --is-ancestor FETCH_HEAD "$SHA" \
            || { echo "::error::${BASE_BRANCH} moved since the check ran, rerun the workflow"; exit 1; }
          git push "$remote" "${SHA}:refs/heads/${BASE_BRANCH}"

  cleanup-ci-images:
    name: Clean up staging images
    runs-on: ubuntu-latest
    steps:
      - name: Clean up staging images older than 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |  # shell
          CUTOFF=$(date -u -d '14 days ago' +%s 2>/dev/null || date -u -v-14d +%s)
          PACKAGE=gha-runner-compose-staging
          VERSION_IDS=$(gh api --paginate "/user/packages/container/${PACKAGE}/versions" \
            --jq ".[] | select((.updated_at | fromdateiso8601) < ${CUTOFF}) | .id" 2>/dev/null || true)
          if [ -z "${VERSION_IDS}" ]; then
            echo "No ${PACKAGE} versions older than 14 days to delete."
            exit 0
          fi
          for ID in ${VERSION_IDS}; do
            echo "Deleting ${PACKAGE} version ${ID} (older than 14 days)"
            gh api --method DELETE "/user/packages/container/${PACKAGE}/versions/${ID}" 2>/dev/null \
              || echo "  ⚠️ Failed to delete version ${ID}."
          done
